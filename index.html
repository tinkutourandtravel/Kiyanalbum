<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Kian Album</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffe6f0,#ffffff);
    overflow:hidden;
}

.album-cover{
    width:90%;
    max-width:900px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:40px;
    box-shadow:0 25px 60px rgba(0,0,0,.15);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:40px;
}

.photo-frame{
    width:350px;
    padding:15px;
    background:linear-gradient(45deg,#ffd700,#fff5b7,#ffd700);
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.photo-frame img{
    width:100%;
    border-radius:15px;
    display:block;
}

.content{
    flex:1;
}

.content h1{
    font-size:60px;
    color:#ff4f8b;
    margin-bottom:10px;
    text-shadow:2px 2px 10px rgba(255,79,139,.2);
}

.content h2{
    font-size:35px;
    color:#333;
    margin-bottom:15px;
}

.content p{
    font-size:18px;
    color:#666;
    line-height:1.8;
}

.quote{
    margin-top:20px;
    padding:15px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 35px;
    background:#ff4f8b;
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px);
}

@media(max-width:768px){
    .album-cover{
        flex-direction:column;
        text-align:center;
    }

    .content h1{
        font-size:45px;
    }

    .photo-frame{
        width:280px;
    }
}
</style>
</head>
<body>

<div class="album-cover">

    <div class="photo-frame">
        <!-- Yahan apni baby photo ka path lagao -->
        <img src="GOOD ME.jpeg" alt="Baby Kian">
    </div>

    <div class="content">
        <h1>Good Memories</h1>

        <h2>Baby Kiyan Album</h2>

        <p>
            Welcome to the beautiful journey of our little angel.
            Every smile, every laugh, and every precious moment
            is captured here forever.
        </p>

        <div class="quote">
            ❤️ Every picture tells a story and every memory lasts forever.
        </div>

        <a href="page1.html" class="btn">Open Album</a>
        
    </div>

</div>

</body>
</html>
