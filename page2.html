<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiyan & Mom Memories</title>

<style>

/* Yahan pura CSS aayega */

body{
    background:#fff6fa;
    font-family:Poppins,sans-serif;
}

/* Video */
.video-box{
    max-width:500px;
    margin:20px auto;
}

/* Gallery */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.photo-card img{
    width:100%;
    border-radius:15px;
    cursor:pointer;
}

/* Popup */
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.popup img{
    max-width:90%;
    max-height:80%;
}


.next-page{
    text-align:center;
    margin-top:40px;
}

.next-btn{
    display:inline-block;
    padding:15px 35px;
    background:linear-gradient(135deg,#ff4f8b,#ff85b3);
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    font-size:18px;
    font-weight:600;
    box-shadow:0 10px 25px rgba(255,79,139,.3);
    transition:0.3s;
}

.next-btn:hover{
    transform:translateY(-5px) scale(1.05);
}

@media(max-width:768px){

    .next-btn{
        width:90%;
        max-width:280px;
        text-align:center;
    }

}

</style>

</head>
<body>

<h1>Kiyan & Mom Special Memories ❤️</h1>

<!-- VIDEO -->
<div class="video-box">
    <video controls width="100%">
        <source src="kian.viedo.mp4" type="video/mp4">
    </video>
</div>

<!-- 4 PHOTOS -->
<div class="gallery">

    <div class="photo-card">
        <img src="photo 1.jpeg" alt="">
    </div>

    <div class="photo-card">
        <img src="photo 2.jpeg" alt="">
    </div>

    <div class="photo-card">
        <img src="photo3.jpeg" alt="">
    </div>

    <div class="photo-card">
        <img src="photo4.jpeg" alt="">
    </div>

</div>

<div class="heart">
    ❤️ 👨‍👩‍👦 ❤️
</div>

<div class="next-page">
    <a href="page3.html" class="next-btn">
        Next Page ➜
    </a>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
    <img id="popup-img">
    <a id="downloadBtn" download>Download Photo</a>
</div>

<script>

/* Yahan pura JavaScript aayega */

const images=document.querySelectorAll('.photo-card img');
const popup=document.getElementById('popup');
const popupImg=document.getElementById('popup-img');
const downloadBtn=document.getElementById('downloadBtn');

images.forEach(img=>{
    img.onclick=()=>{
        popup.style.display='flex';
        popupImg.src=img.src;
        downloadBtn.href=img.src;
    };
});

popup.onclick=()=>{
    popup.style.display='none';
};

</script>

</body>
</html>
