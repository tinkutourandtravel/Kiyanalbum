<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiyan Special Video Memories</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#ffe6f0,#fff8fb,#ffffff);
    min-height:100vh;
    padding:25px;
}

.container{
    max-width:1300px;
    margin:auto;
}

.heading{
    text-align:center;
    margin-bottom:40px;
}

.heading h1{
    color:#ff4f8b;
    font-size:55px;
    text-shadow:0 10px 20px rgba(255,79,139,.3);
}

.heading p{
    color:#666;
    margin-top:10px;
}

/* Video Grid */

.video-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.video-card{
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:12px;
    box-shadow:
    0 15px 30px rgba(0,0,0,.12);
    transition:.4s;
}

.video-card:hover{
    transform:translateY(-10px) rotateY(5deg);
}

.video-card video{
    width:100%;
    border-radius:18px;
}

.video-title{
    text-align:center;
    margin-top:10px;
    color:#ff4f8b;
    font-weight:600;
}

/* Memory Box */

.memory{
    margin-top:40px;
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.memory h2{
    color:#ff4f8b;
    margin-bottom:15px;
}

/* Navigation */

.navigation{
    text-align:center;
    margin-top:40px;
}

.next-btn{
    display:inline-block;
    padding:15px 35px;
    text-decoration:none;
    color:white;
    border-radius:50px;
    background:linear-gradient(135deg,#ff4f8b,#ff85b3);
    font-weight:600;
    box-shadow:0 10px 25px rgba(255,79,139,.3);
}

.next-btn:hover{
    transform:scale(1.05);
}

/* Mobile */

@media(max-width:768px){

.heading h1{
    font-size:34px;
}

.video-gallery{
    grid-template-columns:1fr;
}

.video-card{
    max-width:350px;
    margin:auto;
}

}

</style>
</head>
<body>

<div class="container">

    <div class="heading">
        <h1>Kiyan Special Video Memories ❤️</h1>
        <p>Beautiful Video Collection</p>
    </div>

    <!-- 4 Videos -->

    <div class="video-gallery">

        <div class="video-card">
            <video controls>
                <source src="video 2.MOV" type="video/mp4">
            </video>
            <div class="video-title">Memory Video 1</div>
        </div>

        <div class="video-card">
            <video controls>
                <source src="video 3.MOV" type="video/mp4">
            </video>
            <div class="video-title">Memory Video 2</div>
        </div>

        <div class="video-card">
            <video controls>
                <source src="video 1.MOV" type="video/mp4">
            </video>
            <div class="video-title">Memory Video 3</div>
        </div>

        <div class="video-card">
            <video controls>
                <source src="video 4.MOV" type="video/mp4">
            </video>
            <div class="video-title">Memory Video 4</div>
        </div>

    </div>

    <div class="memory">
        <h2>Special Moments</h2>
        <p>
            Every video captures a beautiful memory of Kiyan's journey.
            These precious moments will always remain a treasure for the family.
        </p>
    </div>

    <!-- Next Page -->

    <div class="navigation">
        <a href="page4.html" class="next-btn">
            Next Page ➜
        </a>
    </div>

</div>

</body>
</html>
